name: Build Android APK

on:
  push:
    branches:
      - claude/senior-app-developer-0b9qqe
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (first run only)
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --account toukhys-team
          else
            echo "EAS project already linked, skipping."
          fi

      - name: Commit linked EAS project id
        run: |
          if ! git diff --quiet app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link EAS project [skip ci]"
            git push
          else
            echo "No app.json changes to commit."
          fi

      # Runs the build on this runner's own hardware instead of EAS's cloud
      # build queue, so it doesn't count against the Expo account's monthly
      # cloud build quota. Still uses EAS only to fetch the existing signing
      # keystore, so the APK stays install-compatible with earlier builds.
      - name: Build Android APK locally
        run: eas build --platform android --profile preview --non-interactive --local --output cookmate-preview.apk

      - name: Publish APK to a rolling GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-latest
          name: Cookmate Android preview (latest)
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.
            Download `cookmate-preview.apk` below and open it on your Android device
            (you may need to allow installs from this source) to install or update the app.
          files: apps/mobile/cookmate-preview.apk
