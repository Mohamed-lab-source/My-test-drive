name: Build Android APK

on:
  push:
    branches:
      - claude/senior-app-developer-0b9qqe
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (first run only)
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --account toukhys-team
          else
            echo "EAS project already linked, skipping."
          fi

      - name: Commit linked EAS project id
        run: |
          if ! git diff --quiet app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link EAS project [skip ci]"
            git push
          else
            echo "No app.json changes to commit."
          fi

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
