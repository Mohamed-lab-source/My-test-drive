name: Build Jarvis APK

on:
  push:
    branches:
      - main
      - claude/jarvis-x1kpna
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create/update GitHub Release with the APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/jarvis-x1kpna'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis (latest build)
          body: "Automatically built from commit ${{ github.sha }}. Download app-debug.apk, transfer it to your Android phone, and install it (allow 'install from unknown sources' when prompted)."
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
