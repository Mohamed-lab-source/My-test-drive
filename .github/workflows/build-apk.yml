name: Build Android APK

on:
  push:
    branches:
      - claude/atomic-habits-app-brainstorm-0seuxv
    paths:
      - "android/**"
      - "public/**"
      - "src/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/atomic-habits-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomic-habits-debug-apk
          path: dist/atomic-habits-debug.apk

      - name: Publish to "latest APK" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Atomic Habits — latest APK
          body: |
            Auto-built from commit ${{ github.sha }} on `${{ github.ref_name }}`.

            Download `atomic-habits-debug.apk` below, then on your Android
            phone open it (or transfer it and open it) to install — you'll
            need to allow "install unknown apps" for the browser/file app you
            use. This is a debug-signed build for personal sideloading.
          files: dist/atomic-habits-debug.apk
          make_latest: true
