name: Build Jarvis APK

on:
  push:
    branches:
      - main
      - claude/jarvis-x1kpna
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the jarvis-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3 tries to install the legacy 'tools'
      # package, which Google removed from the SDK repository — it fails
      # every run. Install the SDK manually instead: cmdline-tools, then
      # whatever platform/build-tools the project actually needs, picking
      # the newest available version rather than hardcoding one that may
      # not exist yet.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && rm tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          COMPILE_SDK=$(grep -oE 'compileSdkVersion = [0-9]+' "$GITHUB_WORKSPACE/android-app/android/variables.gradle" | grep -oE '[0-9]+')
          ALL_PACKAGES=$("$SDKMANAGER" --list 2>/dev/null)
          PLATFORM="platforms;android-${COMPILE_SDK}"
          BUILD_TOOLS=$(echo "$ALL_PACKAGES" | grep -oE "build-tools;${COMPILE_SDK}\.[0-9]+\.[0-9]+" | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(echo "$ALL_PACKAGES" | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          fi
          echo "Installing: platform-tools, $PLATFORM, $BUILD_TOOLS"
          "$SDKMANAGER" "platform-tools" "$PLATFORM" "$BUILD_TOOLS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Create/update GitHub Release with the APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/jarvis-x1kpna'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis (latest build)
          body: "Automatically built from commit ${{ github.sha }}. Download app-debug.apk, transfer it to your Android phone, and install it (allow 'install from unknown sources' when prompted)."
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
