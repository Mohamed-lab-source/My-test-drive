name: Build Masar APK

on:
  push:
    branches: [masar]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --org com.masar --project-name masar --platforms android .

      - name: Set app name
        run: sed -i 's/android:label="masar"/android:label="Masar"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk masar.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masar-v2.0.${{ github.run_number }}
          name: Masar v2.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Download masar.apk below and open it on your Android phone.
          files: masar.apk
          make_latest: true
