# Sets up Khroga (free Spark plan, no billing) and builds the Android app,
# on GitHub's computers.
#
# Before the first full run, add the secret FIREBASE_SERVICE_ACCOUNT (see SETUP.md).
# Without it, this still builds a test app that shows "not connected".
#
# Download the app: GitHub > Actions > latest "Khroga" run > Artifacts > khroga-apk
name: Khroga

on:
  push:
  workflow_dispatch:
    inputs:
      refresh_places:
        description: "Download fresh places from OpenStreetMap"
        type: boolean
        default: false

concurrency:
  group: khroga-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGE: com.khroga.khroga
  # Fingerprints of the test signing key in android/app/khroga-test.keystore
  SHA1: FD:0F:A7:73:8B:35:DF:67:6A:DC:61:62:65:FD:F8:6F:06:27:6C:C3
  SHA256: 1D:FB:9E:2E:F9:D7:A0:E2:B4:01:5A:D9:73:A9:17:1A:A7:F5:42:5D:62:B8:5E:85:40:A9:79:65:3B:05:A2:51
  FIRESTORE_LOCATION: europe-west1

jobs:
  firebase:
    name: Set up Firebase (free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      connected: ${{ steps.check.outputs.connected }}
    steps:
      - name: Is Firebase connected?
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is missing, so the app will show 'not connected'. See SETUP.md."
          fi

      - if: steps.check.outputs.connected == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.connected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.check.outputs.connected == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.check.outputs.connected == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase tools
        if: steps.check.outputs.connected == 'true'
        run: npm install -g firebase-tools

      - name: Make sure there is no billing (so it can never cost money)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          gcloud services enable cloudbilling.googleapis.com --project "$P" >/dev/null 2>&1 || true
          ENABLED=$(gcloud billing projects describe "$P" --format="value(billingEnabled)" 2>/dev/null || echo "unknown")
          echo "Billing enabled: $ENABLED"
          if [ "$ENABLED" = "True" ]; then
            echo "::warning::Billing is turned ON for this Firebase project. Khroga doesn't need it. Switch the project back to the free Spark plan to be sure it never costs money."
          fi

      - name: Turn on the free Google services
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          gcloud services enable --project "$P" \
            cloudresourcemanager.googleapis.com serviceusage.googleapis.com \
            firebase.googleapis.com firestore.googleapis.com identitytoolkit.googleapis.com \
            apikeys.googleapis.com generativelanguage.googleapis.com

      - name: Create the database (first run only)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          if firebase firestore:databases:list --project "$P" | grep -q "(default)"; then
            echo "Database already exists."
          else
            firebase firestore:databases:create "(default)" --location "$FIRESTORE_LOCATION" --project "$P"
          fi

      - name: Put the security rules online
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          for attempt in 1 2 3; do
            firebase deploy --only firestore --project "$P" --non-interactive && exit 0
            echo "Attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Create the AI key, locked to this app (first run only)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          find_key() {
            gcloud services api-keys list --project "$P" \
              --filter="displayName=khroga-app-ai" --format="value(name)" | head -n1
          }
          NAME=$(find_key)
          if [ -z "$NAME" ]; then
            gcloud services api-keys create --project "$P" --display-name=khroga-app-ai \
              --api-target=service=generativelanguage.googleapis.com \
              --allowed-application=sha1_fingerprint="$SHA1",package_name="$ANDROID_PACKAGE"
            for i in 1 2 3 4 5 6; do NAME=$(find_key); [ -n "$NAME" ] && break; sleep 10; done
          fi
          mkdir -p out
          if [ -n "$NAME" ]; then
            gcloud services api-keys get-key-string "$NAME" --format="value(keyString)" > out/gemini.key
          else
            echo "::warning::Could not create the AI key. The app will still plan, just without AI."
            : > out/gemini.key
          fi

      - name: Register the Android app
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          APP_ID=$(firebase apps:list ANDROID --project "$P" --json \
            | jq -r --arg pkg "$ANDROID_PACKAGE" '.result[]? | select(.packageName==$pkg) | .appId' | head -n1)
          if [ -z "$APP_ID" ]; then
            APP_ID=$(firebase apps:create ANDROID Khroga --package-name "$ANDROID_PACKAGE" \
              --project "$P" --json | jq -r '.result.appId')
          fi
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::Could not register the Android app."
            exit 1
          fi
          firebase apps:android:sha:create "$APP_ID" "$SHA1" --project "$P" || echo "SHA-1 already added."
          firebase apps:android:sha:create "$APP_ID" "$SHA256" --project "$P" || echo "SHA-256 already added."
          mkdir -p out
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$P" --out out/google-services.json

      - if: steps.check.outputs.connected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-config
          path: out/
          retention-days: 1

  android:
    name: Build Android app
    needs: firebase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Test the place downloader
        run: node --test tool/fetch_osm_places.test.mjs

      - name: Week number (places are refreshed weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Reuse this week's places
        id: places-cache
        if: ${{ !inputs.refresh_places }}
        uses: actions/cache@v4
        with:
          path: assets/data/places.json
          key: osm-places-v1-${{ steps.week.outputs.week }}

      - name: Download real places from OpenStreetMap
        if: steps.places-cache.outputs.cache-hit != 'true'
        run: node tool/fetch_osm_places.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: places-data
          path: assets/data/places.json
          retention-days: 30

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run app tests
        run: flutter test

      - if: needs.firebase.outputs.connected == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-config
          path: /tmp/app-config

      - name: Connect the app to Firebase
        if: needs.firebase.outputs.connected == 'true'
        run: node tool/gen_firebase_options.mjs /tmp/app-config/google-services.json "$ANDROID_PACKAGE"

      - name: Build APK
        run: |
          KEY=""
          if [ -f /tmp/app-config/gemini.key ]; then KEY=$(cat /tmp/app-config/gemini.key); fi
          echo "::add-mask::$KEY"
          flutter build apk --release --dart-define=GEMINI_API_KEY="$KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: khroga-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
