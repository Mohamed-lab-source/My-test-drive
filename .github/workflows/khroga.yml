# Sets up Khroga (free Spark plan, no billing) and builds the Android app,
# on GitHub's computers.
#
# Before the first full run, add the secret FIREBASE_SERVICE_ACCOUNT (see SETUP.md).
# Without it, this still builds a test app that shows "not connected".
#
# Download the app: GitHub > Actions > latest "Khroga" run > Artifacts > khroga-apk
name: Khroga

on:
  push:
  workflow_dispatch:
    inputs:
      refresh_places:
        description: "Download fresh places from OpenStreetMap"
        type: boolean
        default: false
      make_release_key:
        description: "Make my private Play Store signing key (once, see SETUP.md)"
        type: boolean
        default: false

concurrency:
  group: khroga-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PACKAGE: com.khroga.khroga
  # Fingerprints of the test signing key in android/app/khroga-test.keystore
  SHA1: FD:0F:A7:73:8B:35:DF:67:6A:DC:61:62:65:FD:F8:6F:06:27:6C:C3
  SHA256: 1D:FB:9E:2E:F9:D7:A0:E2:B4:01:5A:D9:73:A9:17:1A:A7:F5:42:5D:62:B8:5E:85:40:A9:79:65:3B:05:A2:51
  FIRESTORE_LOCATION: europe-west1

jobs:
  # Run once from Actions > Khroga > Run workflow > tick "Make my private
  # Play Store signing key". It makes a brand-new key and puts it in a
  # private download (kept 1 day) so you can paste it into two GitHub
  # secrets. The key is never saved in the project.
  release-key:
    name: Make the private release key
    if: github.event_name == 'workflow_dispatch' && inputs.make_release_key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make the key
        run: |
          mkdir -p key
          PW=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 28)
          keytool -genkeypair -v -storetype PKCS12 -keystore key/release.keystore \
            -alias khroga-release -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Khroga, O=Khroga, C=EG"
          base64 -w0 key/release.keystore > key/KHROGA_RELEASE_KEYSTORE.txt
          printf '%s' "$PW" > key/KHROGA_RELEASE_PASSWORD.txt
          keytool -list -v -keystore key/release.keystore -storepass "$PW" -alias khroga-release \
            | grep -E 'SHA1:|SHA256:' > key/fingerprints.txt
          rm key/release.keystore
          cat > key/READ-ME-FIRST.txt <<'TXT'
          Your private Khroga release key. Keep these two files secret.

          1. On GitHub: Settings > Secrets and variables > Actions > New repository secret
          2. Name: KHROGA_RELEASE_KEYSTORE   Value: everything inside KHROGA_RELEASE_KEYSTORE.txt
          3. New secret again. Name: KHROGA_RELEASE_PASSWORD   Value: everything inside KHROGA_RELEASE_PASSWORD.txt
          4. Also save both files somewhere private (e.g. your Google Drive).
             Google Play lets you reset a lost upload key, but it's easier not to lose it.
          5. Delete this download from GitHub when done (it also deletes itself after 1 day).
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: release-key-KEEP-PRIVATE
          path: key/
          retention-days: 1

  firebase:
    name: Set up Firebase (free)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.make_release_key) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      connected: ${{ steps.check.outputs.connected }}
    steps:
      - name: Is Firebase connected?
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is missing, so the app will show 'not connected'. See SETUP.md."
          fi

      - if: steps.check.outputs.connected == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.connected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - if: steps.check.outputs.connected == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: steps.check.outputs.connected == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase tools
        if: steps.check.outputs.connected == 'true'
        run: npm install -g firebase-tools

      - name: Make sure there is no billing (so it can never cost money)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          gcloud services enable cloudbilling.googleapis.com --project "$P" >/dev/null 2>&1 || true
          ENABLED=$(gcloud billing projects describe "$P" --format="value(billingEnabled)" 2>/dev/null || echo "unknown")
          echo "Billing enabled: $ENABLED"
          if [ "$ENABLED" = "True" ]; then
            echo "::warning::Billing is turned ON for this Firebase project. Khroga doesn't need it. Switch the project back to the free Spark plan to be sure it never costs money."
          fi

      - name: Turn on the free Google services
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          gcloud services enable --project "$P" \
            cloudresourcemanager.googleapis.com serviceusage.googleapis.com \
            firebase.googleapis.com firestore.googleapis.com identitytoolkit.googleapis.com \
            apikeys.googleapis.com generativelanguage.googleapis.com \
            securetoken.googleapis.com firebaseinstallations.googleapis.com \
            firebasehosting.googleapis.com

      - name: Create the database (first run only)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          if firebase firestore:databases:list --project "$P" | grep -q "(default)"; then
            echo "Database already exists."
          else
            firebase firestore:databases:create "(default)" --location "$FIRESTORE_LOCATION" --project "$P"
          fi

      - name: Put the security rules online
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          for attempt in 1 2 3; do
            firebase deploy --only firestore --project "$P" --non-interactive && exit 0
            echo "Attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Read the release key's fingerprints (if the secret is set)
        if: steps.check.outputs.connected == 'true'
        id: relsha
        env:
          KS: ${{ secrets.KHROGA_RELEASE_KEYSTORE }}
          PW: ${{ secrets.KHROGA_RELEASE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "No release key yet (that's fine)."; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          INFO=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PW" -alias khroga-release)
          echo "sha1=$(echo "$INFO" | awk '/SHA1:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$INFO" | awk '/SHA256:/{print $2}')" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/release.keystore"

      - name: Create the AI key, locked to this app (first run only)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
          REL_SHA1: ${{ steps.relsha.outputs.sha1 }}
          PLAY_SHA1: ${{ secrets.PLAY_APP_SIGNING_SHA1 }}
        run: |
          find_key() {
            gcloud services api-keys list --project "$P" \
              --filter="displayName=khroga-app-ai" --format="value(name)" | head -n1
          }
          NAME=$(find_key)
          if [ -z "$NAME" ]; then
            gcloud services api-keys create --project "$P" --display-name=khroga-app-ai \
              --api-target=service=generativelanguage.googleapis.com \
              --allowed-application=sha1_fingerprint="$SHA1",package_name="$ANDROID_PACKAGE"
            for i in 1 2 3 4 5 6; do NAME=$(find_key); [ -n "$NAME" ] && break; sleep 10; done
          fi
          mkdir -p out
          # Allow every key Khroga is signed with: the test key, the private
          # release key, and Google Play's own signing key (once you add it).
          if [ -n "$NAME" ]; then
            APPS="--allowed-application=sha1_fingerprint=$SHA1,package_name=$ANDROID_PACKAGE"
            for F in "$REL_SHA1" "$PLAY_SHA1"; do
              [ -n "$F" ] && APPS="$APPS --allowed-application=sha1_fingerprint=$F,package_name=$ANDROID_PACKAGE"
            done
            gcloud services api-keys update "$NAME" $APPS >/dev/null || echo "::warning::Couldn't update the AI key's allowed apps."
          fi
          if [ -n "$NAME" ]; then
            gcloud services api-keys get-key-string "$NAME" --format="value(keyString)" > out/gemini.key
          else
            echo "::warning::Could not create the AI key. The app will still plan, just without AI."
            : > out/gemini.key
          fi

      - name: Register the Android app
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
          REL_SHA1: ${{ steps.relsha.outputs.sha1 }}
          REL_SHA256: ${{ steps.relsha.outputs.sha256 }}
          PLAY_SHA1: ${{ secrets.PLAY_APP_SIGNING_SHA1 }}
          PLAY_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
        run: |
          APP_ID=$(firebase apps:list ANDROID --project "$P" --json \
            | jq -r --arg pkg "$ANDROID_PACKAGE" '.result[]? | select(.packageName==$pkg) | .appId' | head -n1)
          if [ -z "$APP_ID" ]; then
            APP_ID=$(firebase apps:create ANDROID Khroga --package-name "$ANDROID_PACKAGE" \
              --project "$P" --json | jq -r '.result.appId')
          fi
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::Could not register the Android app."
            exit 1
          fi
          firebase apps:android:sha:create "$APP_ID" "$SHA1" --project "$P" || echo "SHA-1 already added."
          firebase apps:android:sha:create "$APP_ID" "$SHA256" --project "$P" || echo "SHA-256 already added."
          # Google sign-in must also trust the release key and Play's signing key.
          for F in "$REL_SHA1" "$REL_SHA256" "$PLAY_SHA1" "$PLAY_SHA256"; do
            [ -n "$F" ] && { firebase apps:android:sha:create "$APP_ID" "$F" --project "$P" || echo "Fingerprint already added."; }
          done
          mkdir -p out
          firebase apps:sdkconfig ANDROID "$APP_ID" --project "$P" --out out/google-services.json

      - name: Let the app's Firebase key use sign-in and the database
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          # Google auto-creates the app's key with a fixed list of allowed
          # services; make sure the ones Khroga needs are on it.
          KEY_STRING=$(jq -r '.client[0].api_key[0].current_key' out/google-services.json)
          NAME=$(gcloud services api-keys lookup "$KEY_STRING" --format="value(name)")
          if [ -z "$NAME" ]; then
            echo "::warning::Couldn't find the app's Firebase key to check its settings."
            exit 0
          fi
          NEEDED="identitytoolkit.googleapis.com securetoken.googleapis.com firestore.googleapis.com firebaseinstallations.googleapis.com"
          CURRENT=$(gcloud services api-keys describe "$NAME" --format=json | jq -r '.restrictions.apiTargets[]?.service')
          if [ -z "$CURRENT" ]; then
            echo "Key has no service limits; nothing to change."
            exit 0
          fi
          ARGS=""
          for svc in $(printf '%s\n%s\n' "$CURRENT" "$(echo $NEEDED | tr ' ' '\n')" | sort -u); do
            ARGS="$ARGS --api-target=service=$svc"
          done
          gcloud services api-keys update "$NAME" $ARGS
          echo "Allowed services now:"
          gcloud services api-keys describe "$NAME" --format=json | jq -r '.restrictions.apiTargets[]?.service'

      - name: Let Khroga links open the app (assetlinks.json)
        if: steps.check.outputs.connected == 'true'
        env:
          P: ${{ steps.auth.outputs.project_id }}
          REL_SHA256: ${{ steps.relsha.outputs.sha256 }}
          PLAY_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
        run: |
          mkdir -p site/.well-known
          FPS=$(printf '%s\n' "$SHA256" "$REL_SHA256" "$PLAY_SHA256" | grep -E '^[0-9A-Fa-f:]{95}$' | sort -u | jq -R . | jq -s -c .)
          jq -n --arg pkg "$ANDROID_PACKAGE" --argjson fps "$FPS" \
            '[{relation:["delegate_permission/common.handle_all_urls"],target:{namespace:"android_app",package_name:$pkg,sha256_cert_fingerprints:$fps}}]' \
            > site/.well-known/assetlinks.json
          cat site/.well-known/assetlinks.json

      - name: Put the privacy policy, terms and account-deletion pages online
        if: steps.check.outputs.connected == 'true'
        continue-on-error: true
        env:
          P: ${{ steps.auth.outputs.project_id }}
        run: |
          firebase deploy --only hosting --project "$P" --non-interactive
          echo "Privacy policy: https://$P.web.app/privacy.html"
          echo "Delete account: https://$P.web.app/delete-account.html"

      # Hand the app's config to the Android job through the build cache
      # (separate from the small artifact storage, which fills up fast).
      - if: steps.check.outputs.connected == 'true'
        uses: actions/cache/save@v4
        with:
          path: out/
          key: app-config-${{ github.run_id }}-${{ github.run_attempt }}

  android:
    name: Build Android app
    needs: firebase
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the APK and bundle to the download links
      actions: write   # to delete old build files (artifact storage is small)
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Test the place tools
        run: node --test tool/fetch_osm_places.test.mjs tool/merge_overture.test.mjs

      - name: Week number (places are refreshed weekly)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Reuse this week's places (or the last good ones)
        id: places-cache
        uses: actions/cache/restore@v4
        with:
          path: assets/data/places.json
          key: osm-places-v2-${{ steps.week.outputs.week }}
          restore-keys: |
            osm-places-v2-${{ steps.week.outputs.week }}-
            osm-places-v2-
            osm-places-v1-

      - name: Download real places from OpenStreetMap
        id: download
        # The OpenStreetMap download is slow (public servers are often busy), so
        # it only runs when nothing is saved yet, or when asked for.
        if: steps.places-cache.outputs.cache-matched-key == '' || inputs.refresh_places
        timeout-minutes: 40
        continue-on-error: true
        run: node tool/fetch_osm_places.mjs

      # Only remember this week's places if the download really worked, so a
      # failed download is retried on the next build.
      - name: Remember this week's places
        if: steps.download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: assets/data/places.json
          key: osm-places-v2-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download more real places from Overture Maps
        id: overture
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install --quiet pyarrow
          python tool/fetch_overture.py build/overture.jsonl

      - name: Merge Overture places and link them to malls
        if: steps.overture.outcome == 'success'
        run: node tool/merge_overture.mjs build/overture.jsonl

      - name: Make sure the app has places
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('assets/data/places.json','utf8')).places.length)")
          echo "Places bundled in the app: $COUNT"
          if [ "${{ steps.download.outcome }}" = "failure" ]; then
            echo "::warning::Downloading fresh places failed, so this build uses the last good set."
          fi
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::No places available (download failed and nothing saved before). Re-run in a few minutes."
            exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run app tests
        run: flutter test

      - if: needs.firebase.outputs.connected == 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/
          key: app-config-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Connect the app to Firebase
        if: needs.firebase.outputs.connected == 'true'
        run: |
          node tool/gen_firebase_options.mjs out/google-services.json "$ANDROID_PACKAGE"
          # Links to our website open the app (see AndroidManifest.xml).
          echo "KHROGA_WEB_HOST=$(jq -r .project_info.project_id out/google-services.json).web.app" >> "$GITHUB_ENV"

      - name: Use the private release key (if the secret is set)
        id: signing
        env:
          KS: ${{ secrets.KHROGA_RELEASE_KEYSTORE }}
          PW: ${{ secrets.KHROGA_RELEASE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed with the TEST key. For the Play Store, make the release key first (SETUP.md, Publishing)."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KHROGA_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KHROGA_RELEASE_PASSWORD=$PW" >> "$GITHUB_ENV"
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PW" -alias khroga-release \
            | awk '/SHA1:/{print $2}' | tr -d ':')
          echo "cert=$SHA" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          MAP_KEY: ${{ secrets.MAP_TILES_KEY }}
        run: |
          KEY=""
          if [ -f out/gemini.key ]; then KEY=$(cat out/gemini.key); fi
          echo "::add-mask::$KEY"
          CERT="${{ steps.signing.outputs.cert }}"
          EXTRA=""
          [ -n "$CERT" ] && EXTRA="--dart-define=ANDROID_CERT_SHA1=$CERT"
          # Every build gets a higher version number (the Play Store needs that).
          flutter build apk --release --dart-define=GEMINI_API_KEY="$KEY" $EXTRA \
            --dart-define=MAP_TILES_KEY="$MAP_KEY" \
            --build-number=$((100 + ${{ github.run_number }})) \
            --dart-define=BUILD_DATE="$(date -u +%Y-%m-%d)"

      # The app bundle is what you upload to the Play Store. It's only made
      # with the private release key, never the shared test key.
      - name: Build the Play Store bundle (.aab)
        if: steps.signing.outputs.release == 'true'
        env:
          MAP_KEY: ${{ secrets.MAP_TILES_KEY }}
        run: |
          KEY=""
          if [ -f out/gemini.key ]; then KEY=$(cat out/gemini.key); fi
          echo "::add-mask::$KEY"
          flutter build appbundle --release --dart-define=GEMINI_API_KEY="$KEY" \
            --dart-define=MAP_TILES_KEY="$MAP_KEY" \
            --dart-define=ANDROID_CERT_SHA1="${{ steps.signing.outputs.cert }}" \
            --build-number=$((100 + ${{ github.run_number }})) \
            --dart-define=BUILD_DATE="$(date -u +%Y-%m-%d)"

      # The bundle also goes to a fixed download link (release assets don't
      # use the small artifact storage). The artifact is a short-lived extra.
      - if: steps.signing.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: khroga-play-store-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload the bundle to the "play-store-bundle" release
        if: steps.signing.outputs.release == 'true' && github.event_name != 'pull_request'
        run: cp build/app/outputs/bundle/release/app-release.aab khroga.aab

      - if: steps.signing.outputs.release == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-store-bundle
          name: Khroga — Play Store bundle
          body: |
            Newest Play Store bundle (${{ github.sha }}), version code ${{ 100 + github.run_number }}.
            Download **khroga.aab** and upload it in Google Play Console. Not for installing on phones.
          prerelease: true
          make_latest: false
          files: khroga.aab
          overwrite_files: true

      # Only Khroga's own build files; other projects' files are left alone.
      - name: Delete old build files (keeps artifact storage free)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | select(.name | IN("khroga-apk", "khroga-play-store-bundle", "places-data", "app-config")) | .id' \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null && echo "deleted $id"; done

      - name: Publish to the fixed download link
        if: github.event_name != 'pull_request'
        run: cp build/app/outputs/flutter-apk/app-release.apk khroga.apk

      - name: Upload to the "latest-apk" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Khroga — latest app
          body: |
            Newest Khroga build (${{ github.sha }}).
            On your phone, tap **khroga.apk** below to download and install.
          prerelease: true
          make_latest: false
          files: khroga.apk
          overwrite_files: true
