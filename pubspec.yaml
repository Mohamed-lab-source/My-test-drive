name: khroga
description: "A new Flutter project."
publish_to: 'none'
version: 1.7.0+20

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_review: ^2.0.12
  intl: ^0.20.3
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/places.json
    - assets/icon/khroga.png
  # Free fonts (SIL Open Font License, see assets/fonts/*-OFL.txt). Alexandria
  # and Readex Pro draw Arabic and Latin; Doto is a dot-matrix face for Latin
  # numbers and the wordmark only.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria_800ExtraBold.ttf
          weight: 800
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Doto_900Black.ttf
          weight: 900
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro_400Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro_500Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro_700Bold.ttf
          weight: 700
