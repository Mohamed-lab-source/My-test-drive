apply plugin: 'com.android.application'

android {
    namespace = "com.jarvis.secretary"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jarvis.secretary"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 25
        versionName "3.8"
        // Phones only: keeps the wake-word engine's native code small
        // 64-bit phones only (every phone since ~2017): keeps the voice and wake-word engines' native code to one copy
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Committed on purpose (debug keys are never secret) so every CI
            // build signs with the SAME certificate. Without this, Gradle
            // auto-generates a random debug key per machine — on GitHub's
            // stateless runners that means a different key on every single
            // build, so Android treats each new APK as a different app and
            // refuses to install it as an update, forcing a full uninstall
            // (wiping all saved settings/reminders/API keys) every time.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Compress native libraries inside the APK (the voice and wake-word engines
    // are ~30 MB uncompressed); Android unpacks them once at install.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // On-device "Hey Jarvis" wake word (openWakeWord models)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // "What am I looking at?": on-device image labels and text. The Play Services
    // variants keep the ~36 MB recognition engine out of the APK; Android fetches
    // it once (see com.google.mlkit.vision.DEPENDENCIES in the manifest).
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // Background watchers (price / rain alerts while Jarvis is closed)
    implementation 'androidx.work:work-runtime:2.10.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
