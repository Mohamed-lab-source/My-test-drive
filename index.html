<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ahmed &amp; Lamia — Wedding Invitation</title>
  <meta name="description" content="Ahmed &amp; Lamia invite you to celebrate their wedding — Wednesday 11 • 11 • 2026, Talinda Hall, Amira Valley." />
  <meta name="theme-color" content="#f4efe6" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ahmed &amp; Lamia — Wedding Invitation" />
  <meta property="og:description" content="Wednesday 11 • 11 • 2026 · 7:00 PM · Talinda Hall, Amira Valley" />
  <meta property="og:url" content="https://mohamed-lab-source.github.io/ahmed-lamia-wedding/" />
  <meta property="og:image" content="https://mohamed-lab-source.github.io/ahmed-lamia-wedding/assets/invitation-card.jpg" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1536" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23b8955a'/><text x='50' y='64' font-size='40' text-anchor='middle' fill='white' font-family='serif'>A&amp;L</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Cinzel:wght@400;500&family=Amiri&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="locked">

  <!-- Petals, sparkles and tap bursts -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- ───── Envelope intro ───── -->
  <div id="envelope-screen">
    <img class="corner c-tl" src="assets/floral-top.webp" alt="" />
    <img class="corner c-tr" src="assets/floral-top.webp" alt="" />
    <img class="corner c-bl" src="assets/floral-bottom-left.webp" alt="" />
    <img class="corner c-br" src="assets/floral-bottom-right.webp" alt="" />

    <div class="intro-text">
      <p class="eyebrow">You are cordially invited</p>
      <p class="intro-script script">to the wedding of</p>
      <p class="intro-names" data-bind="namesShort"></p>
    </div>

    <div class="envelope-float">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-card"><img src="assets/invitation-card.jpg" alt="" /></div>
        <div class="env-front"><span class="env-line"></span></div>
        <div class="env-flap"></div>
        <button class="seal" id="open-btn" aria-label="Open the invitation">
          <span class="half left"><i data-bind="initials"></i></span>
          <span class="half right"><i data-bind="initials"></i></span>
          <span class="seal-ring" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <p class="tap-hint"><span class="tap-dot"></span>Tap the seal to open</p>
    <div class="flash" aria-hidden="true"></div>
  </div>

  <main id="invite">

    <!-- ───── Hero (the invitation card, in HTML) ───── -->
    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <img class="corner h-tl" src="assets/floral-top.webp" alt="" />
      <img class="corner h-tr" src="assets/floral-top.webp" alt="" />
      <img class="corner h-bl" src="assets/floral-bottom-left.webp" alt="" />
      <img class="corner h-br" src="assets/floral-bottom-right.webp" alt="" />

      <div class="arch">
        <div class="arch-glow" aria-hidden="true"></div>
        <svg class="jewel" viewBox="0 0 40 70" aria-hidden="true">
          <line x1="20" y1="0" x2="20" y2="30" />
          <circle cx="20" cy="31" r="2.2" />
          <path class="gem" d="M20 36 L30 46 L20 66 L10 46 Z" />
          <path class="gem-facet" d="M10 46 H30 M20 36 V66 M15 41 L20 46 L25 41" />
        </svg>

        <svg class="rings" viewBox="0 0 120 64" aria-hidden="true">
          <ellipse class="draw" cx="48" cy="38" rx="26" ry="16" pathLength="1" />
          <ellipse class="draw d2" cx="72" cy="34" rx="26" ry="16" pathLength="1" />
          <path class="ring-gem" d="M72 12 l6 6 -6 6 -6 -6z" />
          <g class="glint"><path d="M86 22 l2 -7 2 7 7 2 -7 2 -2 7 -2 -7 -7 -2z" /></g>
        </svg>

        <p class="tagline split" data-bind="tagline"></p>

        <h1 class="names">
          <span class="name">
            <svg class="icon crown" viewBox="0 0 64 40" aria-hidden="true"><path class="draw" pathLength="1" d="M6 32 L4 10 L18 22 L32 4 L46 22 L60 10 L58 32 Z M6 36 H58" /><circle cx="4" cy="9" r="2.5"/><circle cx="32" cy="3" r="2.5"/><circle cx="60" cy="9" r="2.5"/></svg>
            <span class="name-text letters" data-bind="partner1"></span>
          </span>
          <span class="amp"><span>&amp;</span></span>
          <span class="name">
            <svg class="icon rose" viewBox="0 0 64 40" aria-hidden="true"><path class="leaf" d="M20 22 c-10 -2 -14 6 -14 6 c8 3 13 0 14 -6z M44 22 c10 -2 14 6 14 6 c-8 3 -13 0 -14 -6z"/><circle cx="32" cy="20" r="11" /><path class="draw" pathLength="1" d="M32 12 c6 2 7 9 1 11 c-5 1-7-4-3-6 M24 22 c3 5 12 6 16 0" /></svg>
            <span class="name-text letters" data-bind="partner2"></span>
          </span>
        </h1>

        <p class="tagline split" data-bind="invitationLine"></p>

        <div class="facts">
          <div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect class="draw" pathLength="1" x="3" y="5" width="18" height="16" rx="2"/><path class="draw" pathLength="1" d="M3 10h18M8 3v4M16 3v4"/></svg>
            <strong data-bind="dateText"></strong>
            <small data-bind="dayText"></small>
          </div>
          <div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle class="draw" pathLength="1" cx="12" cy="12" r="9"/><path class="hand" d="M12 7v5l3 2"/></svg>
            <strong data-bind="timeText"></strong>
          </div>
          <div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path class="draw" pathLength="1" d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <strong data-bind="venue.name"></strong>
            <small data-bind="venue.place"></small>
          </div>
        </div>

        <p class="closing"><span class="heart-rule"><span class="beat">♡</span></span><span data-bind="closingLine"></span></p>
      </div>
      <a href="#countdown" class="scroll-cue" aria-label="Scroll down"><span></span></a>
    </section>

    <!-- ───── Countdown ───── -->
    <section id="countdown" class="section countdown">
      <div class="flourish reveal" aria-hidden="true"><svg viewBox="0 0 240 30"><use href="#flourish" /></svg></div>
      <h2 class="script reveal">Counting down to forever</h2>
      <div class="timer reveal" id="timer">
        <div><span class="digit" id="cd-days">0</span><small>Days</small></div>
        <div><span class="digit" id="cd-hours">0</span><small>Hours</small></div>
        <div><span class="digit" id="cd-mins">0</span><small>Minutes</small></div>
        <div><span class="digit" id="cd-secs">0</span><small>Seconds</small></div>
      </div>
      <a class="btn btn-ghost reveal" id="add-calendar" target="_blank" rel="noopener">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
        Add to calendar
      </a>
    </section>

    <!-- ───── Venue ───── -->
    <section class="section venue">
      <div class="flourish reveal" aria-hidden="true"><svg viewBox="0 0 240 30"><use href="#flourish" /></svg></div>
      <p class="eyebrow reveal">The venue</p>
      <h2 class="script reveal" data-bind="venue.name"></h2>
      <p class="venue-place reveal" data-bind="venue.place"></p>

      <div class="gallery" id="gallery"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>

      <div class="address reveal">
        <p data-bind="venue.address"></p>
        <p class="ar" lang="ar" dir="rtl" data-bind="venue.addressAr"></p>
      </div>
      <a class="btn reveal" id="map-link" target="_blank" rel="noopener">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Get directions
      </a>
    </section>

    <!-- ───── RSVP (hidden until a contact is set in config.js) ───── -->
    <section class="section rsvp" id="rsvp" hidden>
      <div class="flourish reveal" aria-hidden="true"><svg viewBox="0 0 240 30"><use href="#flourish" /></svg></div>
      <h2 class="script reveal">Will you join us?</h2>
      <p class="eyebrow reveal" data-bind="rsvp.deadlineText"></p>
      <form id="rsvp-form" class="reveal" novalidate>
        <label>Full name
          <input id="rsvp-name" name="name" required autocomplete="name" />
        </label>
        <fieldset class="choice">
          <legend>Attendance</legend>
          <label><input type="radio" name="attending" value="Joyfully accepts" required /> <span>Joyfully accepts</span></label>
          <label><input type="radio" name="attending" value="Regretfully declines" /> <span>Regretfully declines</span></label>
        </fieldset>
        <label>Number of guests
          <select id="rsvp-guests" name="guests">
            <option>1</option><option>2</option><option>3</option><option>4</option>
          </select>
        </label>
        <label>A note for the couple <em>(optional)</em>
          <textarea id="rsvp-message" name="message" rows="3"></textarea>
        </label>
        <button class="btn" type="submit">Send RSVP</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>

    <footer class="footer">
      <img class="corner f-bl" src="assets/floral-bottom-left.webp" alt="" />
      <img class="corner f-br" src="assets/floral-bottom-right.webp" alt="" />
      <div class="hearts" aria-hidden="true"></div>
      <div class="divider reveal" aria-hidden="true"><span>♡</span></div>
      <p class="signature script reveal"><span class="ink"><span data-bind="first1"></span> &amp; <span data-bind="first2"></span></span></p>
      <p class="eyebrow reveal" data-bind="dateText"></p>
      <p class="footer-note reveal" data-bind="closingLine"></p>
    </footer>
  </main>

  <!-- Lightbox for venue photos -->
  <dialog id="lightbox"><img alt="" /><button aria-label="Close">×</button></dialog>

  <!-- Shared ornament -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="flourish" fill="none" stroke-linecap="round">
        <path class="fl-line" pathLength="1" d="M4 15 H84 C96 15 98 5 108 7 C114 8 114 15 108 16 C104 17 102 13 106 11" />
        <path class="fl-line" pathLength="1" d="M236 15 H156 C144 15 142 5 132 7 C126 8 126 15 132 16 C136 17 138 13 134 11" />
        <path class="fl-gem" d="M120 6 L128 15 L120 24 L112 15 Z" />
        <circle class="fl-dot" cx="120" cy="15" r="2" />
      </g>
    </defs>
  </svg>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
